# Shared cargo-deny policy for the native emulator, its shipped frontends
# and the standalone crates with committed lockfiles (cputest-runner, the
# hostsocket and zz9k WASM boards, bezel-preview). Run with
# `cargo deny --all-features --locked check`; CI's "Dependency policy" job
# applies this file to each of those manifests. The fuzz workspace derives
# its lockfile in CI and is not checked here.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each exception is dated, narrow, and explains why an upgrade cannot remove
# it. Published vulnerabilities still fail the job by default.
ignore = [
    # 2026-11-18. All chrono releases are marked unmaintained. delharc 0.8
    # requires it for LHA timestamps, and on Windows iroh's netwatch 0.20
    # depends on it both directly and through wmi. Remove this exception
    # when both paths stop pulling in chrono. Review by 2027-02-18.
    "RUSTSEC-2026-0543",
    # 2026-08-21: unmaintained warning, not a vulnerability, and there is
    # no safe upgrade -- it arrives transitively through
    # winit -> sctk-adwaita -> ab_glyph -> owned_ttf_parser. Revisit when
    # the winit stack moves to the skrifa-based font crates.
    "RUSTSEC-2026-0192",
    # 2026-11-26 (first recorded 2026-08-21): unmaintained warning on
    # bincode 1.x, not a published vulnerability. Save-state files no longer
    # use it: .clstate chunks, the descriptor included, are MessagePack
    # (src/savestate/chunk.rs). bincode only encodes the in-process
    # snapshots behind reverse debugging, run-ahead and netplay rollback
    # (M68kMachine::write_state, write_rollback_state). Only the process
    # that wrote them reads them back, and they never come from a file or
    # the network: netplay peers and spectators rebuild the machine from its
    # settings, media and inputs. Those reads still go through
    # savestate::StateReader, which never sizes a buffer from a length
    # prefix. The advisory covers every bincode release (3.0 is a
    # non-functional tombstone, and its authors call 1.3.3 complete), so
    # clearing it means choosing a different snapshot encoding. As the
    # snapshots never outlive the process, that is a code change with no
    # file-format consequence. Review by 2027-02-26.
    "RUSTSEC-2025-0141",
]

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "Unlicense",
]
# Copperline itself is GPL-3.0-or-later; everything it vendors or links
# must be compatible with that. Anything outside the allow list fails the
# check and needs an explicit, reviewed exception here.
confidence-threshold = 0.93

# Egui embeds these unmodified fonts alongside the application code. Their
# notices accompany desktop packages in THIRD_PARTY_FONTS.txt.
[[licenses.exceptions]]
name = "epaint_default_fonts"
version = "0.37.0"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
# Git dependencies have no Cargo version requirement, so cargo-deny reports
# them as wildcards even when Cargo pins a revision in the lockfile. Keep the
# signal visible without failing the source-policy job.
wildcards = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Project-owned sources: mt32-rs, Coppersynth, and plmpeg-rs are
# revision-pinned in the manifest; FluxBridge currently follows its
# maintained main branch. pixels comes from CopperlineHQ's fork through the
# revision-pinned [patch.crates-io]: upstream's unreleased bounded
# surface-acquire retry (parasyte/pixels#462) plus a wgpu 30 port (see
# Cargo.toml). Drop it with the patch once a pixels release carries both.
allow-git = [
    "https://github.com/CopperlineHQ/mt32-rs",
    "https://github.com/CopperlineHQ/Coppersynth",
    "https://github.com/CopperlineHQ/plmpeg-rs",
    "https://github.com/CopperlineHQ/FluxBridge",
    "https://github.com/CopperlineHQ/pixels",
]
