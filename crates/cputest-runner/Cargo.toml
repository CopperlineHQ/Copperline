# Standalone driver that runs WinUAE cputest-generated instruction test
# sets against the in-tree m68k core. Not part of the emulator build; see
# tools/cputest-gen.sh for generating the data and README in vendor/ for
# provenance.
[package]
name = "copperline-cputest-runner"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "cputest-runner"
path = "src/main.rs"

[dependencies]
m68k = { package = "copperline-m68k", path = "../m68k" }

[build-dependencies]
cc = "1"
