# Standalone driver that runs WinUAE cputest-generated instruction test
# sets against m68k. Not part of the emulator build; see
# tools/cputest-gen.sh for generating the data and README in vendor/ for
# provenance.
[package]
name = "copperline-cputest-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "cputest-runner"
path = "src/main.rs"

[dependencies]
m68k = "0.3.1"

[build-dependencies]
cc = "1"
