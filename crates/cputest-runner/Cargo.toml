# Standalone driver that runs WinUAE cputest-generated instruction test
# sets against m68k. Not part of the emulator build; see
# tools/cputest-gen.sh for generating the data and README in vendor/ for
# provenance.
[package]
name = "copperline-cputest-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "cputest-runner"
path = "src/main.rs"

[dependencies]
# Match the emulator dependency; CI checks all CPU consumer lockfiles.
m68k = { git = "https://github.com/CopperlineHQ/m68k-rs", rev = "f50b139a344039c74f964d5ffe9958c83419189d" }

[build-dependencies]
cc = "1"
