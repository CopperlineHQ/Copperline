[package]
name = "copperline-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Browser (wasm32) frontend for the Copperline Amiga emulator"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The headless core only: no winit/pixels/cpal/wasmtime.
copperline = { path = "../..", default-features = false }
# Pinned exactly: the wasm-bindgen CLI that post-processes the build must be
# the same version (installed via homebrew).
wasm-bindgen = "=0.2.127"
anyhow = "1"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"

# The fat-LTO release profile comes from the workspace root manifest. The
# emulator's hot path crosses the web wrapper, CPU, bus and chipset crates:
# fat LTO is about 4% faster than thin LTO in the controlled Chrome AROS
# workload, so the longer release link is worthwhile for the shipped bundle.
