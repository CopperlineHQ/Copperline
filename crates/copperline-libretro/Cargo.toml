[package]
name = "copperline-libretro"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Libretro frontend for the Copperline Amiga emulator"
publish = false

[lib]
name = "copperline_libretro"
crate-type = ["cdylib", "rlib"]

[dependencies]
copperline = { path = "../..", default-features = false }
anyhow = "1"
sha2 = { version = "0.11", default-features = false }

tempfile = "3"
bincode = "1.3"

# Build profiles, including this core's `strip = "none"` override, live in
# the workspace root manifest.
