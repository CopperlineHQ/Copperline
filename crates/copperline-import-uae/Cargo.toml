# A standalone converter: WinUAE/Amiberry/FS-UAE config files -> Copperline
# TOML. Depends on the root crate only for its config module (RawConfig
# parsing, Config::try_from validation) -- default-features = false pulls in
# no GUI, audio, JIT, or control-server code, just src/config/.

[package]
name = "copperline-import-uae"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Converts WinUAE, Amiberry, and FS-UAE config files to Copperline TOML"
publish = false

# Standalone: deliberately not a member of any workspace, so building this
# crate never changes the root package's lockfile or native artifacts
# (the same shape as crates/copperline-player and crates/copperline-web).
[workspace]

[dependencies]
copperline = { path = "../..", default-features = false }
toml_edit = "0.22"
anyhow = "1"
