# Static-link the MSVC C runtime on Windows so the release binaries and the
# packaged zips (packaging/windows/build-zip.ps1) run without the Visual C++
# Redistributable installed. Scoped to the MSVC targets (x86-64 and ARM64),
# so the macOS and Linux builds are unaffected.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# A single machine's state (`copperline::emulator::Emu`) is large enough
# that `cargo test`'s default per-test thread stack can overflow building
# even one on the stack in an unoptimized build (the browser crate's suite
# does). Raising the default covers every test, present and future, instead
# of requiring each one to opt in by hand. It lives here, at the workspace
# root, because Cargo reads configuration from the current directory
# upwards: a member's own .cargo/config.toml is invisible to
# `cargo test -p <member>` or `--workspace` run from the root. A
# RUST_MIN_STACK value already set in the environment still takes
# precedence.
[env]
RUST_MIN_STACK = "67108864"
