# Flatpak manifest for Copperline.
#
# Copperline is a GUI desktop application (wgpu via pixels, audio via cpal,
# windowing via winit, gamepads via gilrs, file dialogs via rfd). The
# Freedesktop runtime supplies Mesa/Vulkan, PipeWire/PulseAudio and the
# portal stack, so none of those need bundling.
#
# Flathub requires the build to run offline: cargo cannot reach crates.io,
# so the dependency crates are vendored through cargo-sources.json (generated
# from the committed Cargo.lock by generate-cargo-sources.sh) and Cargo is
# pointed at that offline registry.
#
# Local build and test:
#   flatpak install flathub org.freedesktop.Platform//25.08 \
#       org.freedesktop.Sdk//25.08 org.freedesktop.Sdk.Extension.rust-stable//25.08
#   ./packaging/flatpak/generate-cargo-sources.sh
#   flatpak run org.flatpak.Builder --force-clean --user --install \
#       --install-deps-from=flathub --repo=repo builddir \
#       packaging/flatpak/dev.copperline.Copperline.yaml
#   flatpak run dev.copperline.Copperline
#
# Lint before opening a Flathub PR:
#   flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
#       manifest packaging/flatpak/dev.copperline.Copperline.yaml
#   flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
#       repo repo
id: dev.copperline.Copperline
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: copperline

finish-args:
  # Windowing: Wayland preferred, X11 fallback.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Bridged Ethernet uses only a host-created, per-user AF_PACKET descriptor
  # passed over this exact runtime socket. The sandbox gets no raw device and
  # no broad /run access; --share=network lets it use the passed descriptor.
  - --share=network
  - --filesystem=xdg-run/copperline-net-helper
  # GPU acceleration for the wgpu/pixels render path.
  - --device=dri
  # Game controllers (gilrs reads /dev/input via udev).
  - --device=input
  # Audio (cpal).
  - --socket=pulseaudio
  # TODO(portal): Copperline opens ROM/ADF/HDF/CD images from arbitrary
  # paths through rfd, which currently uses a non-portal backend, so it needs
  # direct host filesystem access. Migrating rfd to its xdg-portal backend
  # would let this be dropped in favour of the file-chooser portal, which is
  # the Flathub-preferred approach. Until then, read-write host access is
  # required for the file dialogs to reach the user's images.
  - --filesystem=host

modules:
  - name: copperline
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        # Build entirely from the vendored crate archives staged by the
        # cargo sources below; never touch the network.
        CARGO_HOME: /run/build/copperline/cargo
        CARGO_NET_OFFLINE: "1"
    build-commands:
      # Cargo.lock is committed and the crate archives are vendored, so
      # --locked + --offline reproduce the pinned graph.
      - cargo --offline build --release --locked
      - install -Dm755 target/release/copperline -t ${FLATPAK_DEST}/bin/
      # Bundled AROS open-source Kickstart replacement (the default boot ROM).
      # romsearch.rs resolves it relative to the binary via
      # <prefix>/share/copperline/aros, i.e. /app/share/copperline/aros here.
      # AROS is APL-licensed and freely redistributable, unlike a real
      # Kickstart.
      - install -Dm644 assets/aros/aros-amiga-m68k-rom.bin
        -t ${FLATPAK_DEST}/share/copperline/aros/
      - install -Dm644 assets/aros/aros-amiga-m68k-ext.bin
        -t ${FLATPAK_DEST}/share/copperline/aros/
      - install -Dm644 assets/aros/LICENSE
        ${FLATPAK_DEST}/share/copperline/aros/LICENSE
      # Bundled open CD32 FMV cartridge ROM (the CD32 profile default).
      - install -Dm644 assets/fmv/copperline-fmv.rom
        -t ${FLATPAK_DEST}/share/copperline/fmv/
      - install -Dm644 assets/fmv/README.md
        -t ${FLATPAK_DEST}/share/copperline/fmv/
      # Bundled open-source A4091 autoboot ROM (default when a config fits an
      # A4091 without naming a ROM); romsearch.rs resolves it via
      # <prefix>/share/copperline/a4091.
      - install -Dm644 assets/a4091/a4091_cdfs.rom
        -t ${FLATPAK_DEST}/share/copperline/a4091/
      - install -Dm644 assets/a4091/README.md
        -t ${FLATPAK_DEST}/share/copperline/a4091/
      - install -Dm644 assets/a4091/THIRD_PARTY_NOTICES.txt
        -t ${FLATPAK_DEST}/share/copperline/a4091/
      # Copperline's open A2091/A590 autoboot ROM.
      - install -Dm644 assets/a2091/copperline-a2091.rom
        -t ${FLATPAK_DEST}/share/copperline/a2091/
      - install -Dm644 assets/a2091/README.md
        -t ${FLATPAK_DEST}/share/copperline/a2091/
      - install -Dm644 assets/a2091/THIRD_PARTY_NOTICES.txt
        -t ${FLATPAK_DEST}/share/copperline/a2091/
      # Bundled open-source lide.device autoboot ROM and CD-filesystem bank
      # (default for a fitted [lide] board without a named rom/rom_bank2);
      # romsearch.rs resolves it via <prefix>/share/copperline/lide.
      - install -Dm644 assets/lide/lide.rom
        -t ${FLATPAK_DEST}/share/copperline/lide/
      - install -Dm644 assets/lide/lide-atbus.rom
        -t ${FLATPAK_DEST}/share/copperline/lide/
      - install -Dm644 assets/lide/cdfs.rom
        -t ${FLATPAK_DEST}/share/copperline/lide/
      - install -Dm644 assets/lide/README.md
        -t ${FLATPAK_DEST}/share/copperline/lide/
      - install -Dm644 assets/lide/THIRD_PARTY_NOTICES.txt
        -t ${FLATPAK_DEST}/share/copperline/lide/
      # Bundled HRTMon freezer-cartridge image (default for [cartridge]
      # model = "hrtmon" without a named rom); romsearch.rs resolves it via
      # <prefix>/share/copperline/hrtmon.
      - install -Dm644 assets/hrtmon/hrtmon.rom
        -t ${FLATPAK_DEST}/share/copperline/hrtmon/
      - install -Dm644 assets/hrtmon/README.md
        -t ${FLATPAK_DEST}/share/copperline/hrtmon/
      - install -Dm644 assets/hrtmon/LICENSE
        -t ${FLATPAK_DEST}/share/copperline/hrtmon/
      # Desktop integration metadata.
      - install -Dm644 packaging/flatpak/dev.copperline.Copperline.desktop
        ${FLATPAK_DEST}/share/applications/dev.copperline.Copperline.desktop
      - install -Dm644 packaging/flatpak/dev.copperline.Copperline.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/dev.copperline.Copperline.metainfo.xml
      - install -Dm644 assets/brand/copperline-icon.png
        ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/dev.copperline.Copperline.png
      # WHDLoad support archives (direct WHDLoad boot, src/whdload.rs).
      # flatpak-builder fetches them as pinned sources (the build itself is
      # offline); dest-filename places them in the build root. Checksums are
      # pinned in step with tools/fetch-whdload.sh.
      - install -Dm644 WHDLoad_usr.lha
        -t ${FLATPAK_DEST}/share/copperline/whdboot/
      - install -Dm644 skick346.lha
        -t ${FLATPAK_DEST}/share/copperline/whdboot/
      - install -Dm644 assets/whdboot/README.md
        -t ${FLATPAK_DEST}/share/copperline/whdboot/
      # Flathub requires the project license to be installed.
      - install -Dm644 LICENSE
        ${FLATPAK_DEST}/share/licenses/dev.copperline.Copperline/LICENSE
    sources:
      # Build the checked-out source tree. This is what CI
      # (.github/workflows/flatpak.yml) validates, and it includes both the
      # bundled AROS ROM (assets/aros/) and these packaging files.
      #
      # For the Flathub submission, replace this with the tagged release so
      # builds are reproducible from a fixed point:
      #   - type: git
      #     url: https://github.com/CopperlineHQ/Copperline.git
      #     tag: vX.Y.Z
      #     commit: <sha>
      # NOTE: the tag must be one that already contains assets/aros/ (the AROS
      # ROM was added after v0.1.0), or the install steps below fail.
      #
      # Locally, build from a clean checkout: a dir source copies the whole
      # tree, including any large uncommitted ROM/disk images in the repo root.
      - type: dir
        path: ../..
      # Vendored crate archives + cargo config pointing at the offline
      # registry. CI and local/Flathub packaging generate this untracked file
      # from Cargo.lock immediately before the build.
      - cargo-sources.json
      # WHDLoad support archives, fetched by flatpak-builder with pinned
      # checksums (kept in step with tools/fetch-whdload.sh; whdload.de's
      # WHDLoad_usr.lha is a rolling latest-release file, so a new upstream
      # WHDLoad release means reviewing it and bumping the hash everywhere).
      - type: file
        url: https://whdload.de/whdload/WHDLoad_usr.lha
        sha256: 093333953737528d79c1eda7d21a16a0aa298698722624e7cfb31f588a0a156d
      - type: file
        url: https://aminet.net/util/boot/skick346.lha
        sha256: 02b4d01852d12ab391c6469064f917221a0f7319fd0b3ba6c359403ec1d59f96
      # Coppersynth's bundled soundfont. The synth crate's build script
      # embeds assets/GeneralUser-GS.sf2 into the library, downloading it
      # first when absent -- which an offline Flathub build cannot. Staged
      # here instead, pinned to an upstream commit, into the vendored
      # crate's cache path, so the sandboxed build embeds the same bank as
      # every other build. GeneralUser GS permits redistribution; its
      # licence text travels inside the bundle beside the bank.
      - type: file
        url: https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/684543d5e5efaef08d02be50dcda8d552478fa60/GeneralUser-GS.sf2
        sha256: 9575028c7a1f589f5770fccc8cff2734566af40cd26ed836944e9a5152688cfe
        dest: cargo/vendor/coppersynth/assets
      - type: file
        url: https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/684543d5e5efaef08d02be50dcda8d552478fa60/documentation/LICENSE.txt
        sha256: 7b32efefdf95ce38a043799f0659853ddc00fbaa14d8c50f0aca16b9b8b405be
        dest: cargo/vendor/coppersynth/assets
        dest-filename: GeneralUser-GS.LICENSE.txt
