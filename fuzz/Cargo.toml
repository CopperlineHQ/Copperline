[package]
name = "copperline-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
# Parser coverage does not need a window, audio device, network backends or
# dynamically loaded board plugins. Keep debug info, compressed CD audio,
# FMV state and JIT state support in the instrumented core.
copperline = { path = "..", default-features = false, features = ["control", "dap", "cpu-jit", "cd-mp3", "cd32-fmv"] }

# The untrusted-media parsers, in the order SECURITY.md's threat model makes
# them reachable: a hostile disk image, CD image, hardfile, archive, or save
# state is attacker-supplied input parsed before any guest code runs. Run
# with `cargo +nightly fuzz run <target>` from this directory (see
# fuzz/README.md).

[[bin]]
name = "dms"
path = "fuzz_targets/dms.rs"
test = false
doc = false
bench = false

[[bin]]
name = "floppy_image"
path = "fuzz_targets/floppy_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cd_image"
path = "fuzz_targets/cd_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hardfile_classification"
path = "fuzz_targets/hardfile_classification.rs"
test = false
doc = false
bench = false

[[bin]]
name = "savestate"
path = "fuzz_targets/savestate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archives"
path = "fuzz_targets/archives.rs"
test = false
doc = false
bench = false

[[bin]]
name = "debug_info"
path = "fuzz_targets/debug_info.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_protocol"
path = "fuzz_targets/control_protocol.rs"
test = false
doc = false
bench = false

[[example]]
name = "generate_savestate_seed"
path = "tools/generate_savestate_seed.rs"

[workspace]
members = ["."]
