[package]
name = "copperline"
version = "0.13.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
description = "A cycle-driven Amiga emulator written in Rust"
readme = "README.md"
repository = "https://github.com/CopperlineHQ/Copperline"
keywords = ["amiga", "emulator", "m68k"]
categories = ["emulators"]
publish = false
# `cargo run` should keep launching the emulator now that the headless
# `copperline-bench` bin target exists.
default-run = "copperline"

[build-dependencies]
# Compiles the vendored FloppyBridge sources; see build.rs.
cc = "1"

[features]
default = [
    "midi",
    "frontend",
    "wasm-boards",
    "control",
    "ctl-bin",
    "net-nat",
    "floppybridge",
]
display-plan-trace = []
# Local investigation switches that deliberately alter timing or rendering.
# Normal builds keep these environment-variable overrides inert so release
# behavior is hardware-derived and reproducible.
internal-diagnostics = []
# Host MIDI bridge for Paula's serial port (`[serial] mode = "midi"`). Built in
# by default; `--no-default-features` compiles it out, and a MIDI-free build
# pulls no MIDI code and links no MIDI framework. Native backends per platform:
# CoreMIDI (macOS), the ALSA sequencer (Linux), WinMM (Windows); other targets
# get a stub. See src/midi/.
midi = []
# The interactive desktop frontend: the winit/pixels window and launcher,
# host audio output, gamepads, file dialogs, and the debugger console's
# clipboard paste. Off, the crate is the portable headless core (the surface
# a wasm32 browser frontend builds against); the `copperline` binary
# requires it.
frontend = [
    "dep:winit",
    "dep:pixels",
    "dep:cpal",
    "dep:gilrs",
    "dep:rfd",
    "dep:arboard",
    "dep:env_logger",
]
# The wasmtime host for functional Zorro boards (src/wasmboard.rs). Separate
# from `frontend` because it is a core-machine feature, but Cranelift cannot
# be compiled FOR wasm32, so browser builds turn it off.
wasm-boards = ["dep:wasmtime"]
# The headless `copperline-bench` benchmark binary (core-only; also builds
# for wasm32-wasip1). Off by default so native release artifacts are
# unchanged.
bench-bin = []
# The Copperline Control Protocol server (src/control/): a JSON-RPC interface
# over loopback TCP for driving the emulator from scripts and external tools
# (`--control` headless, `--control-gui` windowed). Uses std::net + threads,
# so browser builds (--no-default-features) compile it out.
control = ["dep:serde_json"]
# User-mode NAT backend for emulated NICs (`[a2065] net = "nat"`, src/net/nat/):
# a slirp-style virtual gateway giving the guest outbound IPv4 with no host
# privileges. Uses std::net + threads, so browser builds compile it out.
net-nat = ["dep:smoltcp"]
# The `copperline-ctl` command-line client for the control protocol.
ctl-bin = ["dep:serde_json"]
# Real floppy drives through Rob Smith's FloppyBridge (src/floppybridge/): a
# DrawBridge, Greaseweazle, or Supercard Pro standing in for a disk image on any
# drive. On, build.rs compiles the vendored bridge (vendor/floppybridge) into the
# binary, so nothing has to be installed for a physical drive to work. Off, none
# of it is built -- neither the C++ nor the Rust side -- which is what browser
# builds (--no-default-features) want.
floppybridge = []

[dependencies]
# Path-only dependency on the in-tree fork (crates/m68k). No version requirement
# and a non-crates.io package name (copperline-m68k) guarantee the local copy is
# always used and the upstream `m68k` crate can never be pulled in; aliased back
# to `m68k` so source keeps `use m68k::...`. See crates/m68k/Cargo.toml.
m68k = { package = "copperline-m68k", path = "crates/m68k" }
pixels = { version = "0.17", optional = true }
winit = { version = "0.30", optional = true }
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
serde-big-array = "0.5"
bincode = "1"
toml = "0.8"
png = "0.17"
flate2 = "1"
cpal = { version = "0.15", optional = true }
# Kept unconditional (not `frontend`-gated) because the Windows MIDI backend
# (src/midi/winmm.rs) also uses it; it is pure Rust and wasm-safe.
ringbuf = "0.4"
hound = "3.5"
rfd = { version = "0.17.2", optional = true }
gilrs = { version = "0.11", optional = true }
# Host clipboard for the debugger console's paste (text only; the default
# image-data feature is left off). wayland-data-control covers Wayland
# hosts; X11 support is built in on Linux.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"], optional = true }
# WASM plugin host for functional Zorro boards (src/wasmboard.rs). Lean feature
# set: the Cranelift JIT + runtime only -- no WASI, component model, GC, threads,
# or wat parsing in the shipped binary (kept deterministic; see the determinism
# Config in wasmboard.rs). Pin the version: save-state replay of a plugin's
# linear-memory snapshot is only guaranteed within one wasmtime build, so
# changing this is a savestate::STATE_VERSION bump, not a routine update.
# Track an LTS line (24.x, 36.x, 48.x, ...): those keep receiving security
# backports, which the line this was previously pinned to (27.x) did not.
wasmtime = { version = "=36.0.12", default-features = false, features = ["cranelift", "runtime"], optional = true }
# Userspace TCP/IP stack for the NAT backend (src/net/nat/): terminates the
# guest's ARP and TCP on the virtual gateway so flows can be spliced onto host
# sockets. Pure Rust, 0BSD, lean feature set: Ethernet + IPv4 + TCP sockets
# only (DHCP/DNS/UDP/ICMP are handled at frame level with the wire parsers).
smoltcp = { version = "0.12", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
], optional = true }
# Already pulled in transitively; used directly only for localtime_r (local
# time-zone filename stamps) and, on macOS, the pthread QoS class used for the
# optional realtime-priority feature (see src/priority.rs).
libc = "0.2"
zerocopy = { version = "0.8", features = ["derive"] }

# macOS dock icon: winit's with_window_icon is a no-op on macOS, so the dock
# icon must be set at runtime via NSApplication. These objc2 versions match the
# ones rfd already pulls in, so they add no new crate copies to the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

# Optional realtime-priority feature: cross-platform thread scheduling control.
# Only used off macOS -- the macOS path uses the libc pthread QoS API directly
# (Core Audio already runs the audio callback real-time), so this crate (and
# the windows-sys it pulls in) never enters the macOS build. Excluded on
# wasm32, where there are no host threads to schedule.
[target.'cfg(not(any(target_os = "macos", target_arch = "wasm32")))'.dependencies]
thread-priority = "3.1"

# Browser builds only: std::time::Instant/SystemTime panic on
# wasm32-unknown-unknown; web-time backs them with performance.now()/Date.now().
# See src/timebase.rs -- native targets re-export std::time unchanged.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1"

[[bin]]
name = "copperline"
path = "src/main.rs"
required-features = ["frontend"]

[[bin]]
name = "copperline-bench"
path = "src/bin/bench.rs"
required-features = ["bench-bin"]

[[bin]]
name = "copperline-ctl"
path = "src/bin/copperline-ctl.rs"
required-features = ["ctl-bin"]

[dev-dependencies]
# Compile WAT to wasm bytes in the WASM-plugin-host tests, so golden test
# plugins live as readable text in the tests rather than checked-in binaries.
wat = "1"

[lints.clippy]
# Chipset pipeline functions take per-signal argument lists that mirror the
# hardware; bundling them into structs would obscure the data flow.
too_many_arguments = "allow"
# Indexed loops over fixed-size register banks (bitplanes, sprites, audio
# channels) keep the channel number visible and often index several parallel
# arrays; iterator rewrites obscure that.
needless_range_loop = "allow"

[profile.release]
opt-level = 3
lto = "thin"
