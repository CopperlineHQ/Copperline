name: Browser demo

# Builds the wasm browser frontend (crates/copperline-web) and publishes it
# to the copperline.dev website repository (CopperlineHQ/copperline.github.io)
# under /try when a v* tag is pushed, so the in-browser emulator always
# matches the latest release. A workflow_dispatch trigger allows
# re-publishing from whatever ref it is run on without cutting a release.
#
# The page shell (try/index.html) is hand-written in the website repository
# and left alone. This workflow replaces the parts that must change together
# with the emulator: the wasm-bindgen bundle (try/pkg), the JS glue that
# drives the WebEmu API (try/try.js, the netplay modules and QR license,
# try/render-stride.js, try/serial-telnet.js, try/audio-worklet.js, sourced from
# crates/copperline-web/www), and the AROS ROMs (try/aros).
#
# Pushing to the website repository needs the SITE_DEPLOY_KEY secret: the
# private half of an SSH deploy key whose public half is installed with
# write access on CopperlineHQ/copperline.github.io (shared with docs-site.yml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: wasm-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish the browser demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        # The CLI must match the crate dependency exactly; the version is
        # pinned in crates/copperline-web/Cargo.toml and parsed from there so
        # they cannot drift apart.
        run: |
          V=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/copperline-web/Cargo.toml)
          test -n "$V"
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: Install binaryen
        # Pinned from upstream releases, never apt: Ubuntu ships binaryen
        # 108 (2022), whose wasm-opt mangles the externref table
        # wasm-bindgen's glue grows at startup - the published bundle then
        # dies at load with "WebAssembly.Table.grow(): failed to grow
        # table by 4". Modern binaryen also reads the module's feature
        # section itself, so the pass needs no --enable flags to keep.
        run: |
          set -euo pipefail
          V=version_131
          curl --location --silent --show-error --fail \
            https://github.com/WebAssembly/binaryen/releases/download/$V/binaryen-$V-x86_64-linux.tar.gz \
            | tar xz
          echo "$PWD/binaryen-$V/bin" >> "$GITHUB_PATH"
      - name: Build the web crate
        working-directory: crates/copperline-web
        # simd128: every wasm-capable browser has had fixed-width SIMD for
        # years, and the render passes vectorize measurably (+6% whole-run
        # on an Ice Lake laptop). wasm-opt -O3 then shrinks the bundle by
        # about 13%. The crate's fat-LTO release profile costs more link time
        # but is about 4% faster than thin LTO in the controlled Chrome AROS
        # workload; an earlier standalone-V8 regression did not reproduce in
        # the actual browser after the hot-path profiling work landed.
        run: |
          RUSTFLAGS="-C target-feature=+simd128" \
            cargo build --release --target wasm32-unknown-unknown --locked
          wasm-bindgen --target web --out-dir pkg \
            target/wasm32-unknown-unknown/release/copperline_web.wasm
          wasm-opt -O3 \
            pkg/copperline_web_bg.wasm -o pkg/copperline_web_bg.wasm
          test -s pkg/copperline_web_bg.wasm
      - name: Smoke-load the optimized bundle
        # The one check that would have caught a wasm-opt-mangled table:
        # instantiate the exact glue + binary pair that is about to be
        # published and build a machine from it. Anything wrong with the
        # pair fails here, before the site sees it.
        working-directory: crates/copperline-web
        run: |
          set -euo pipefail
          # The glue is a self-contained ES module behind a .js name, and
          # wasm-bindgen emits no package.json "type" to say so; a copy
          # with an .mjs name loads as ESM on every Node version, without
          # leaning on newer Nodes' syntax detection.
          cp pkg/copperline_web.js pkg-smoke-glue.mjs
          cat > pkg-smoke.mjs <<'SMOKE'
          import { readFileSync } from 'fs';
          import init, { WebEmu } from './pkg-smoke-glue.mjs';
          await init({ module_or_path: readFileSync('./pkg/copperline_web_bg.wasm') });
          const emu = new WebEmu('A500', 'PAL', 2);
          if (!emu.drive_connected(0) || !emu.drive_connected(1) || emu.drive_connected(2)) {
            throw new Error('browser floppy drive count was not applied');
          }
          emu.insert_floppy_writable(1, new Uint8Array(901120), 'blank.adf');
          if (emu.floppy_write_protected(1) !== false || emu.export_floppy(1).length !== 901120) {
            throw new Error('browser writable floppy did not round-trip in memory');
          }
          const writableState = emu.save_state();
          emu.eject_floppy(1);
          emu.load_state(writableState);
          if (emu.floppy_write_protected(1) !== false || emu.export_floppy(1).length !== 901120) {
            throw new Error('browser writable floppy did not survive a save-state round trip');
          }
          const driveless = new WebEmu('A500', 'PAL', 0);
          if ([0, 1, 2, 3].some((drive) => driveless.drive_connected(drive))) {
            throw new Error('zero browser floppy drive count left a drive connected');
          }
          for (const invalid of [-1, 5, 2.5, 257, NaN, Infinity]) {
            try {
              new WebEmu('A500', 'PAL', invalid);
              throw new Error(`invalid browser floppy drive count was accepted: ${invalid}`);
            } catch (error) {
              if (String(error).includes('was accepted')) throw error;
            }
          }
          if (emu.presentation_revision() !== 0) {
            throw new Error('fresh presentation revision is not zero');
          }
          emu.run(0, 0);
          if (!Number.isFinite(emu.last_run_core_ms()) || emu.last_run_render_ms() !== 0) {
            throw new Error('invalid browser host-timing split');
          }
          console.log('bundle loads:', emu.machine_summary());
          SMOKE
          node pkg-smoke.mjs
          node ../../tools/check-web-netplay.mjs pkg
          rm pkg-smoke.mjs pkg-smoke-glue.mjs
      - name: Check out the website repository
        uses: actions/checkout@v7
        with:
          repository: CopperlineHQ/copperline.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site
      - name: Replace the generated parts of /try
        # The hand-written page shell must already exist in the site repo;
        # refuse to publish a bundle onto a site that has no page for it.
        run: |
          test -f site/try/index.html
          rm -rf site/try/pkg site/try/aros
          mkdir -p site/try/pkg site/try/aros
          cp crates/copperline-web/pkg/copperline_web.js \
             crates/copperline-web/pkg/copperline_web_bg.wasm site/try/pkg/
          cp crates/copperline-web/www/try.js \
             crates/copperline-web/www/render-stride.js \
             crates/copperline-web/www/netplay.js \
             crates/copperline-web/www/netplay-room.js \
             crates/copperline-web/www/netplay-diagnostics.js \
             crates/copperline-web/www/netplay-qr.js \
             crates/copperline-web/www/netplay-qr.LICENSE \
             crates/copperline-web/www/serial-telnet.js \
             crates/copperline-web/www/audio-worklet.js site/try/
          cp assets/aros/aros-amiga-m68k-rom.bin \
             assets/aros/aros-amiga-m68k-ext.bin \
             assets/aros/LICENSE assets/aros/ACKNOWLEDGEMENTS site/try/aros/
      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A try
          if git diff --cached --quiet; then
            echo "Browser demo is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Publish the browser demo for ${{ github.ref_name }}"
          git push
