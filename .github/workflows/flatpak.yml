name: Flatpak

# Builds the Flatpak bundle and runs flatpak-builder-lint, the same gate
# Flathub applies to submissions, so manifest/metadata regressions are caught
# before a Flathub PR. The vendored-crate list is generated from Cargo.lock for
# every build, so dependency PRs cannot leave the offline inputs stale.
on:
  push:
    branches: [main]
    paths:
      - "packaging/flatpak/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/flatpak.yml"
  pull_request:
    paths:
      - "packaging/flatpak/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/flatpak.yml"

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-sources:
    name: Generate cargo-sources.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate vendored-crate sources
        run: ./packaging/flatpak/generate-cargo-sources.sh
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak/cargo-sources.json
          if-no-files-found: error

  build:
    name: Build and lint bundle
    needs: cargo-sources
    runs-on: ubuntu-latest
    # The flatpak-github-actions image ships flatpak-builder, the Freedesktop
    # runtime/SDK matching the manifest, and flatpak-builder-lint.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: copperline.flatpak
          manifest-path: packaging/flatpak/dev.copperline.Copperline.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          # Mirrors the manifest+repo linting Flathub runs on submissions.
          run-tests: false
