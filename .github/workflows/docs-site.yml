name: Docs site HTML

# Builds the HTML manual with MyST and publishes it to the copperline.dev
# website repository (CopperlineHQ/copperline.github.io) under /docs when a v*
# tag is pushed on a vN release branch, so the docs on the site always match
# the latest release.
# The HTML build itself is checked on every push/PR by the docs job in
# ci.yml; this workflow only handles publication. A workflow_dispatch
# trigger allows re-publishing from whatever ref it is run on (e.g. after a
# docs hotfix on a release branch) without cutting a release.
#
# Pushing to the website repository needs the SITE_DEPLOY_KEY secret: the
# private half of an SSH deploy key whose public half is installed with
# write access on CopperlineHQ/copperline.github.io.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-branch:
    name: Check the tag is on a release branch
    # Releases are cut only from the vN maintenance branches (RELEASE.md,
    # "Branches"), so a v* tag pushed anywhere else -- a test tag on main,
    # say -- builds nothing for the site and leaves copperline.dev showing
    # the current release line. A manual run publishes whatever ref it is
    # run on, as before.
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branches=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)' \
            | grep -E '^origin/v[0-9]+$' || true)
          if [ -n "$branches" ]; then
            echo "$TAG is on release branch(es): $branches"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is not on a vN release branch; copperline.dev is left unchanged."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish HTML docs
    needs: release-branch
    if: needs.release-branch.outputs.publish == 'true'
    # No Typst/PDF here, so plain ubuntu is enough (unlike docs-release.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install MyST CLI
        run: npm install -g mystmd
      - name: Build HTML
        working-directory: docs
        env:
          # The docs live under copperline.dev/docs, not at the site root;
          # MyST prepends this to every internal link and asset URL.
          BASE_URL: /docs
        run: |
          myst build --html --ci --strict
          test -s _build/html/index.html
      - name: Inject the analytics snippet
        # GoatCounter is added at deploy time so the MyST sources stay
        # analytics-free. The hand-written pages in the website repository
        # carry the same snippet directly in their <head>.
        working-directory: docs
        run: |
          find _build/html -name '*.html' -print0 | xargs -0 perl -0777 -pi -e \
            's{</head>}{<script data-goatcounter="https://linuxjedi.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>\n</head>}'
          grep -q 'data-goatcounter' _build/html/index.html
      - name: Check out the website repository
        uses: actions/checkout@v7
        with:
          repository: CopperlineHQ/copperline.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site
      - name: Replace /docs with the new build
        # A full replace (not an overlay) so pages and hashed assets deleted
        # upstream do not linger on the site.
        run: |
          rm -rf site/docs
          cp -r docs/_build/html site/docs
      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Docs are unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Publish docs for ${{ github.ref_name }}"
          git push
