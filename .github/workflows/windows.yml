name: Windows

# Everything here runs as a two-leg matrix: x86-64 on windows-latest and
# ARM64 on the windows-11-arm runner, each leg building natively for its own
# architecture (no cross-compiling). Per architecture, two parallel builder
# jobs produce the portable Windows zip and the prebuilt test executables
# (the zip uses the shipping release profile; tests use the optimized ci
# profile without fat LTO), then the checks fan out in
# parallel against those artifacts, mirroring ci.yml: the packaged zip is
# booted from a clean directory (and its copperline-ctl / import-uae
# companions started), and the unit suites plus the probe golden
# renders (pixel-exact deterministic boots on the bundled AROS ROM) run
# against the prebuilt test binaries. This is also the only Windows coverage
# (the main CI runs on macOS and Linux), so the code-path triggers below run
# the full release build on pull requests too. On a v* tag push (or a manual
# run with release_tag) both zips are attached to the GitHub Release by the
# release job, which runs only after every check on both architectures has
# passed.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "vendor/**"
      - "assets/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".cargo/**"
      - "packaging/windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "vendor/**"
      - "assets/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".cargo/**"
      - "packaging/windows/**"
      - ".github/workflows/windows.yml"
  # Manual rebuild. Use this to attach zips to a release whose tag predates
  # this workflow (the v* tag tree has no windows.yml, so a tag push cannot
  # trigger it): run it against a branch that has the source parity you want
  # (for v0.2.0, main is identical to the tag bar the Homebrew bump) and set
  # release_tag to push the built zips onto that existing release.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the zips to (e.g. v0.2.0). Leave blank to only upload workflow artifacts."
        required: false
        default: ""

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

# Seed each native build cache on main; PR copies cannot serve other PRs
# and crowd out the shared entries when several matrices run together.
jobs:
  build:
    name: Build Windows zip (${{ matrix.arch }})
    # Compiles the release binary and packages the portable zip; the sibling
    # test-bins job compiles the test executables in parallel on its own
    # runner.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Force LF checkout
        # The runner's git converts detected-text files to CRLF on checkout
        # by default. The repo carries no .gitattributes, and tests that
        # embed or read committed fixtures expect the bytes as committed, so
        # keep the working tree identical to the macOS/Linux jobs.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Ensure rustup
        # windows-latest ships rustup preinstalled; the windows-11-arm image
        # may not. Install the native rustup when it is absent so the
        # toolchain action below works identically on both runners.
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/${{ matrix.target }}/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            Remove-Item rustup-init.exe
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: windows-zip-${{ matrix.target }}
      - name: Build release zip
        shell: pwsh
        run: packaging/windows/build-zip.ps1 -Target ${{ matrix.target }}
      - name: Locate artifact
        id: artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem Copperline-*-win-${{ matrix.arch }}.zip | Select-Object -First 1
          "path=$($zip.Name)" >> $env:GITHUB_OUTPUT
      - name: Upload zip
        # Consumed by the zip-smoke and release jobs, and kept as the
        # workflow artifact. Uploading here (before the checks run) also
        # means a failing check still leaves the zip downloadable for
        # debugging.
        uses: actions/upload-artifact@v7
        with:
          name: copperline-windows-${{ matrix.arch }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  test-bins:
    name: Build test binaries (${{ matrix.arch }})
    # Compiles the #[test] targets once and hands the finished executables
    # to the test jobs below (needs: test-bins) as a workflow artifact.
    # Binaries, not a shared cargo cache: the test executables are plain
    # libtest binaries and run fine without cargo. cargo builds the emulator
    # binary here too (the integration tests spawn it through the
    # compile-time CARGO_BIN_EXE_copperline path), so the staged
    # copperline.exe pairs with the probe_golden harness compiled alongside
    # it and this job needs nothing from the zip build. Separate cache keys
    # keep the shipping and CI profiles warm independently.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Force LF checkout
        # Keep committed fixture bytes identical to the build job (see the
        # comment there).
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Ensure rustup
        # See the build job's identical step.
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/${{ matrix.target }}/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            Remove-Item rustup-init.exe
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: windows-tests-${{ matrix.target }}
      - name: Compile test binaries
        shell: pwsh
        # The JSON build plan maps each test target to its hash-suffixed
        # executable so the binaries can be staged under stable names for
        # the fan-out jobs. The asset-gated integration tests under tests/
        # keep compiling here too (they are #[ignore]d at run time, not
        # excluded from the build).
        run: |
          $ErrorActionPreference = "Stop"
          & packaging/windows/enable-clang.ps1 -Target ${{ matrix.target }}
          cargo test --profile ci --locked --target ${{ matrix.target }} --no-run --timings --message-format=json > cargo-test-build.json
          if ($LASTEXITCODE -ne 0) { throw "cargo test --no-run exited with $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path ci-bins | Out-Null
          Copy-Item target\${{ matrix.target }}\ci\copperline.exe ci-bins\
          Get-Content cargo-test-build.json | ForEach-Object {
            $msg = $_ | ConvertFrom-Json
            if ($msg.reason -eq "compiler-artifact" -and $msg.profile.test -and $msg.executable) {
              switch ("$($msg.target.kind[0]):$($msg.target.name)") {
                "lib:copperline"     { Copy-Item $msg.executable ci-bins\unit-lib.exe }
                "bin:copperline"     { Copy-Item $msg.executable ci-bins\unit-bin-copperline.exe }
                "bin:copperline-ctl" { Copy-Item $msg.executable ci-bins\unit-bin-copperline-ctl.exe }
                "test:probe_golden"  { Copy-Item $msg.executable ci-bins\probe_golden.exe }
              }
            }
          }
          Get-ChildItem ci-bins
      - name: Upload binaries for the test jobs
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-bins-${{ matrix.arch }}
          path: ci-bins/
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-windows-${{ matrix.arch }}
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

  zip-smoke:
    name: Packaged zip boot smoke (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    # No checkout: the zip must stand on its own, which is the point of the
    # test.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: copperline-windows-${{ matrix.arch }}
      - name: Smoke test the packaged zip
        shell: pwsh
        # Expand the freshly built zip outside the workspace and boot it from
        # there: the run must find the bundled AROS ROM through the sibling
        # aros\ lookup next to the exe (romsearch.rs), not the source tree's
        # assets/aros fallback that a repo-root cwd would satisfy. A capture
        # run opens no window or audio device (src/main.rs windowless
        # capture), so a clean exit plus a non-empty PNG proves the shipped
        # bundle boots on a bare Windows host.
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $zip = Get-ChildItem Copperline-*-win-${{ matrix.arch }}.zip | Select-Object -First 1
          $stage = Join-Path $env:RUNNER_TEMP "zip-smoke"
          Expand-Archive -Path $zip.FullName -DestinationPath $stage
          $exe = Get-ChildItem -Path $stage -Recurse -Filter copperline.exe | Select-Object -First 1
          Set-Location $exe.DirectoryName
          & $exe.FullName --noaudio --screenshot-after 10 smoke.png
          if ($LASTEXITCODE -ne 0) { throw "packaged emulator exited with $LASTEXITCODE" }
          if ((Get-Item smoke.png).Length -eq 0) { throw "screenshot is empty" }
          # The command-line companions must ship beside the emulator (the
          # VS Code extension and MCP clients run copperline-ctl, which
          # launches the copperline.exe next to it) and must start.
          foreach ($tool in @("copperline-ctl.exe", "copperline-import-uae.exe")) {
            $path = Join-Path $exe.DirectoryName $tool
            if (-not (Test-Path $path)) { throw "$tool missing from the zip" }
            & $path --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$tool --help exited with $LASTEXITCODE" }
          }

  unit-tests:
    name: Unit tests (${{ matrix.arch }})
    needs: test-bins
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - name: Force LF checkout
        # Keep committed fixture bytes identical to the build job (see the
        # comment there); some unit tests read fixtures at run time.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-test-bins-${{ matrix.arch }}
          path: ci-bins
      - name: Unit tests
        shell: pwsh
        # The inline #[cfg(test)] suites in the lib and binaries, prebuilt
        # by the test-bins job (this is everything a root `cargo test` runs
        # besides tests/probe_golden.rs, which has its own job below; the
        # crate has no doctests).
        run: |
          $ErrorActionPreference = "Stop"
          ./ci-bins/unit-lib.exe
          if ($LASTEXITCODE -ne 0) { throw "unit-lib exited with $LASTEXITCODE" }
          ./ci-bins/unit-bin-copperline.exe
          if ($LASTEXITCODE -ne 0) { throw "unit-bin-copperline exited with $LASTEXITCODE" }
          ./ci-bins/unit-bin-copperline-ctl.exe
          if ($LASTEXITCODE -ne 0) { throw "unit-bin-copperline-ctl exited with $LASTEXITCODE" }

  probe-golden:
    name: Probe golden renders (${{ matrix.arch }})
    needs: test-bins
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Force LF checkout
        # Keep committed fixture bytes identical to the build job (see the
        # comment there); the golden comparison reads committed renders.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-test-bins-${{ matrix.arch }}
          path: ci-bins
      - name: Probe golden renders
        shell: pwsh
        # tests/probe_golden.rs is fully self-contained (committed probe
        # binaries booted on the bundled AROS ROM) and compares each probe's
        # deterministic render pixel-for-pixel against the references in
        # timing-test/golden/ -- proving the emulation core behaves
        # identically on Windows, not merely that it compiles. Each probe is
        # its own #[test], so the boots run in parallel on the runner's
        # cores. See timing-test/README.md "CI golden renders" for the
        # re-bless workflow.
        #
        # The test harness spawns the emulator through the compile-time
        # CARGO_BIN_EXE_copperline path, which on hosted runners is the same
        # absolute path in every job of this repo -- hence the copy into the
        # --target build directory before running.
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path target\${{ matrix.target }}\ci | Out-Null
          Copy-Item ci-bins\copperline.exe target\${{ matrix.target }}\ci\copperline.exe
          ./ci-bins/probe_golden.exe
          if ($LASTEXITCODE -ne 0) { throw "probe_golden exited with $LASTEXITCODE" }
      - name: Upload probe render diffs
        # On a golden mismatch the test writes the actual renders and diff
        # masks; surface them so the regression is reviewable from the run.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: probe-golden-diffs-windows-${{ matrix.arch }}
          path: target/probe-golden/
          if-no-files-found: ignore

  msix:
    name: Microsoft Store package
    # Wraps the already-built payloads into the .msixbundle that goes to
    # Partner Center. It needs no compiler and no ARM64 runner: the bundle is
    # just the two architectures' zip payloads plus a manifest and the Store
    # logos, so the bytes shipped through the Store are exactly the bytes the
    # zip-smoke job booted.
    #
    # The bundle is a workflow artifact, never a release asset. It is
    # deliberately unsigned -- the Store re-signs it during certification --
    # so a copy downloaded from a GitHub release would install nowhere.
    needs: build
    runs-on: windows-latest
    steps:
      - name: Force LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Check package identity
        id: identity
        shell: pwsh
        # Until the Partner Center values are filled into identity.psd1 there
        # is nothing valid to build, and a hard failure here would redden
        # every push. Skip instead, and start packaging by itself once the
        # identity lands.
        run: |
          $identity = Import-PowerShellDataFile packaging/windows/msix/identity.psd1
          $configured = $identity.Name -notlike "REPLACE-*"
          "configured=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $configured) {
            Write-Host "::notice::Package identity is unset in packaging/windows/msix/identity.psd1; skipping the Store package."
          }
      - uses: actions/download-artifact@v8
        if: steps.identity.outputs.configured == 'true'
        with:
          pattern: copperline-windows-*
          merge-multiple: true
          path: zips
      - name: Expand the release payloads
        id: payloads
        if: steps.identity.outputs.configured == 'true'
        shell: pwsh
        # Each zip holds one top-level Copperline-<version>-win-<arch>
        # directory, which is the staged payload build-msix.ps1 packs.
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          foreach ($arch in @("x64", "arm64")) {
            $zip = Get-ChildItem zips -Filter "Copperline-*-win-$arch.zip" | Select-Object -First 1
            if (-not $zip) { throw "no zip for $arch" }
            $dest = Join-Path $env:RUNNER_TEMP "payload-$arch"
            Expand-Archive -Path $zip.FullName -DestinationPath $dest
            $staged = Get-ChildItem $dest -Directory | Select-Object -First 1
            "$arch=$($staged.FullName)" >> $env:GITHUB_OUTPUT
          }
      - name: Build the msixbundle
        if: steps.identity.outputs.configured == 'true'
        shell: pwsh
        run: |
          packaging/windows/msix/build-msix.ps1 `
            -Payload "x64=${{ steps.payloads.outputs.x64 }}", "arm64=${{ steps.payloads.outputs.arm64 }}" `
            -OutDir "$env:RUNNER_TEMP/msix"
      - name: Verify the bundle
        if: steps.identity.outputs.configured == 'true'
        shell: pwsh
        # Unpack what was just built and check it end to end: both
        # architectures present, the identity Partner Center will match on,
        # and the emulator itself inside each package. A manifest mistake
        # fails here rather than in a Store certification run hours later.
        #
        # The identity is compared against identity.psd1, not merely printed:
        # a wrong-but-well-formed Name or Publisher packs perfectly and is
        # then refused at upload, which is the slowest possible place to find
        # out. The version is compared against the one in the bundle's own
        # file name, so every package in the bundle agrees with the bundle.
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $bundle = Get-ChildItem "$env:RUNNER_TEMP/msix" -Filter *.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw "no msixbundle was produced" }
          $identity = Import-PowerShellDataFile packaging/windows/msix/identity.psd1
          if ($bundle.BaseName -notmatch '^Copperline-(\d+\.\d+\.\d+\.0)$') {
            throw "unexpected bundle name $($bundle.Name)"
          }
          $expectedVersion = $Matches[1]
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Sort-Object Name -Descending
          $makeappx = $sdk | ForEach-Object { Join-Path $_.FullName "x64\makeappx.exe" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found on the runner" }
          $unpacked = Join-Path $env:RUNNER_TEMP "unbundled"
          & $makeappx unbundle /o /p $bundle.FullName /d $unpacked
          if ($LASTEXITCODE -ne 0) { throw "makeappx unbundle failed" }
          foreach ($arch in @("x64", "arm64")) {
            $msix = Get-ChildItem $unpacked -Filter "Copperline-$arch.msix" | Select-Object -First 1
            if (-not $msix) { throw "the bundle has no $arch package" }
            $dir = Join-Path $env:RUNNER_TEMP "unpacked-$arch"
            & $makeappx unpack /o /p $msix.FullName /d $dir
            if ($LASTEXITCODE -ne 0) { throw "makeappx unpack failed for $arch" }
            if (-not (Test-Path (Join-Path $dir "copperline.exe"))) {
              throw "the $arch package has no copperline.exe"
            }
            if (-not (Test-Path (Join-Path $dir "aros\aros-amiga-m68k-rom.bin"))) {
              throw "the $arch package has no bundled AROS ROM"
            }
            $manifest = [xml](Get-Content (Join-Path $dir "AppxManifest.xml"))
            $declared = $manifest.Package.Identity
            foreach ($check in @(
              @{ Field = "ProcessorArchitecture"; Got = $declared.ProcessorArchitecture; Want = $arch },
              @{ Field = "Name"; Got = $declared.Name; Want = $identity.Name },
              @{ Field = "Publisher"; Got = $declared.Publisher; Want = $identity.Publisher },
              @{ Field = "Version"; Got = $declared.Version; Want = $expectedVersion }
            )) {
              if ($check.Got -cne $check.Want) {
                throw "the $arch package declares $($check.Field) '$($check.Got)', expected '$($check.Want)'"
              }
            }
            $shown = $manifest.Package.Properties.PublisherDisplayName
            if ($shown -cne $identity.PublisherDisplayName) {
              throw "the $arch package declares PublisherDisplayName '$shown', expected '$($identity.PublisherDisplayName)'"
            }
            Write-Host "$arch : $($declared.Name) $($declared.Version) $($declared.Publisher)"
          }
      - name: Upload the Store package
        if: steps.identity.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: copperline-msixbundle
          path: ${{ runner.temp }}/msix/*.msixbundle
          if-no-files-found: error

  release:
    name: Attach zips to release
    # Runs only once every Windows check on both architectures has passed,
    # preserving the old single-job ordering where the tests gated the
    # release attach. Plain ubuntu: this job only moves the already-built
    # artifacts.
    needs: [zip-smoke, unit-tests, probe-golden]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: copperline-windows-*
          merge-multiple: true
      - name: Locate artifacts
        id: artifacts
        # Fail fast if the downloaded zips are not where this job expects
        # them; an unmatched glob would otherwise pass the literal pattern
        # to the upload steps below. Both architectures must be present --
        # a release with only one of the two zips is a packaging bug.
        run: |
          for arch in x64 arm64; do
            zip=(Copperline-*-win-"$arch".zip)
            if [ ! -f "${zip[0]}" ]; then
              echo "no Copperline-*-win-$arch.zip in $PWD" >&2
              exit 1
            fi
          done
          echo "paths=$(ls Copperline-*-win-*.zip | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Copperline-*-win-*.zip
      - name: Attach to existing release (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # --clobber so a re-run replaces the assets instead of failing on a
        # name clash; --repo because this job runs without a checkout.
        run: |
          for zip in ${{ steps.artifacts.outputs.paths }}; do
            gh release upload "${{ inputs.release_tag }}" "$zip" --clobber --repo "${{ github.repository }}"
          done
