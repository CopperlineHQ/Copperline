name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, test, lint
    # Copperline is developed and tested on macOS; the Linux and Windows
    # paths are not yet verified, so CI runs on macOS to match. The runner's
    # Metal stack also makes the headless render path (the smoke job below)
    # reliable. Linux/Windows jobs can be added once those paths are verified.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        # Not --all: that would reach into the vendored MIT m68k crate, which
        # keeps its own formatting.
        run: cargo fmt --check
      - name: Clippy
        # Hold the binary, tests, examples, and diagnostic feature gates to
        # the same warning-clean standard used for release checks.
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build (release)
        run: cargo build --release --locked
      - name: Unit tests and probe golden renders
        # The asset-gated integration tests under tests/ are #[ignore]d
        # (they need local Kickstart ROM/disk assets) and are intentionally
        # not run here. tests/probe_golden.rs is the exception: it is fully
        # self-contained (committed probe binaries booted on the bundled
        # AROS ROM) and compares each probe's deterministic render
        # pixel-for-pixel against the references in timing-test/golden/ --
        # the hardware-behaviour regression net (DDF/DIW placement and
        # DDFSTRT-phase/scroll maps, raced copper-chunky COLOR00 trains,
        # sprite serializer/DMA-FSM positions, BLTPRI CPU pacing bars,
        # byte-write register mirroring, the CLXDAT collision matrix, and
        # the 32 CPU/chip-bus timing rows). Each probe is its own #[test],
        # so the boots run in parallel on the runner's cores. See
        # timing-test/README.md "CI golden renders" for the re-bless
        # workflow.
        run: cargo test --release --locked
      - name: Upload probe render diffs
        # On a golden mismatch the test writes the actual renders and diff
        # masks; surface them so the regression is reviewable from the run.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-golden-diffs
          path: target/probe-golden/
          if-no-files-found: ignore
      - name: m68k core tests
        # The vendored CPU core (crates/m68k) is a path dependency, not a
        # workspace member, so the root `cargo test` above never reaches its
        # suites -- including the MMU walker, access-fault frame, exception,
        # and per-model architecture tests. Two suites are excluded because
        # they include_bytes! gitignored fixture binaries and do not compile
        # on a clean checkout (cross_cpu, musashi); the SingleStepTests
        # suite compiles and skips itself here, and runs for real in the
        # m68k-singlestep job below. No --locked: the crate's own Cargo.lock
        # is deliberately gitignored (the root lockfile pins it when built
        # as a dependency).
        working-directory: crates/m68k
        run: |
          ls tests/*.rs | xargs -n1 basename | sed 's/\.rs$//' \
            | grep -v -e '^cross_cpu_tests$' -e '^musashi_tests$' \
            | sed 's/^/--test /' \
            | xargs cargo test --release --lib

  m68k-singlestep:
    name: m68k SingleStepTests (68000 fixtures)
    # Runs the per-instruction 68000 fixture suite against the real
    # SingleStepTests data (MIT, generated from MAME's microcoded core):
    # every opcode's final register/memory state, plus address-error
    # behavior. The fixture clone is ~1 GB, so it lives in its own job and
    # does not gate the main build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SingleStepTests m68000 fixtures
        uses: actions/checkout@v4
        with:
          repository: SingleStepTests/m68000
          path: sst-m68000
      - name: Run fixture suite
        working-directory: crates/m68k
        env:
          M68K_SST_FIXTURES: ${{ github.workspace }}/sst-m68000/v1
        run: cargo test --release --test singlestep_m68000_v1_tests

  docs:
    name: Docs build (HTML + PDF)
    # Independent of the Rust build: catches MyST/cross-reference breakage
    # (e.g. duplicate labels that only collide in the single-document PDF).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install MyST CLI
        run: npm install -g mystmd
      - name: Install Typst (PDF renderer)
        # MyST shells out to Typst for PDF export; brew matches docs/README.md.
        run: brew install typst
      - name: Build HTML
        working-directory: docs
        run: myst build --html --ci --strict --check-links
      - name: Build PDF
        working-directory: docs
        # The PDF export merges every chapter into one document, so it is the
        # build that surfaces duplicate-label and cross-reference errors.
        # Assert the artifact exists and is non-empty so the job fails even if
        # the CLI ever returns success on a partial render.
        run: |
          myst build --pdf --ci --strict
          test -s _build/exports/copperline.pdf
      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copperline-docs-pdf
          path: docs/_build/exports/copperline.pdf
          if-no-files-found: ignore

  gdb-remote:
    name: GDB remote protocol tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: RSP unit tests
        run: cargo test --locked gdbstub

  diagrom-smoke:
    name: DiagROM boot smoke
    needs: build-test
    runs-on: macos-latest
    # DiagROM (diagrom.com) is freely downloadable but its author keeps
    # redistribution to the official site, so it is fetched at run time
    # (checksum-pinned, cached across runs) instead of being committed.
    # The DIAGROM_URL repository variable optionally overrides the
    # download location should the official URL move; the stable V1.3
    # archive has been frozen upstream since 2023, so a checksum change
    # means the pin below needs updating, not that the job is flaky.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --locked
      - name: Restore cached DiagROM
        id: diagrom-cache
        uses: actions/cache@v4
        with:
          path: diagrom.rom
          key: diagrom-stable-v1.3
      - name: Fetch DiagROM (stable V1.3)
        if: steps.diagrom-cache.outputs.cache-hit != 'true'
        env:
          DIAGROM_URL: ${{ vars.DIAGROM_URL }}
        run: |
          curl -fsSL --retry 3 "${DIAGROM_URL:-https://www.diagrom.com/files/stable/DiagROM.zip}" -o DiagROM.zip
          echo "a575f8fa69b1ac7fd566fcdcd19a68e53d472ac6c56d8a6a9489229882c5b208  DiagROM.zip" | shasum -a 256 -c
          unzip -o DiagROM.zip DiagROM/DiagROM
          mv DiagROM/DiagROM diagrom.rom
          rm -rf DiagROM.zip DiagROM
      - name: Boot smoke (serial banner + headless screenshot)
        # DiagROM boots as a Kickstart replacement, so the ROM is passed
        # positionally (the no-argument default is the bundled AROS ROM).
        # DiagROM mirrors its diagnostics to the serial port, which the
        # emulator routes to stdout by default; seeing the version banner
        # proves the ROM's boot code actually executed, which a non-empty
        # PNG alone does not (a black screen still writes one).
        run: |
          ./target/release/copperline diagrom.rom --noaudio --screenshot-after 6 diag.png > serial.log
          grep -q "Amiga DiagROM" serial.log
          test -s diag.png
      - name: DiagROM menu image regression
        # The asset-gated integration test boots to the main menu and
        # asserts the status bar's left-margin text columns survive.
        run: |
          mkdir -p test-assets
          cp diagrom.rom test-assets/
          cargo test --release --locked --test image_regression diagrom -- --ignored --nocapture
      - name: Upload boot screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagrom-boot
          path: |
            diag.png
            serial.log
          if-no-files-found: ignore
