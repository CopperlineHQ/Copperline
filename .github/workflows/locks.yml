name: Lockfile sync

# Verifies every committed Cargo.lock still resolves with --locked, i.e. is
# in sync with its workspace's manifests. The root lock covers the emulator
# and the frontends in its workspace (browser, libretro, player), and
# `cargo tree --workspace` resolves all of their graphs in one step.
# The standalone crates the root workspace excludes carry their own
# committed locks: the cputest-runner lock pins its `m68k` dependency and the
# hostsocket-plugin lock pins its `smoltcp` dependency (the committed
# assets/hostsocket/hostsocket_plugin.wasm is built from it). A manifest
# update without a lock refresh breaks `cargo build --locked` (issue #219:
# the v0.12.0 tag shipped a frontend lockfile, then separate, still pinning
# copperline 0.11.0).
#
# The v* tag trigger is the part that closes issue #219: the drift reached
# the 0.12.0 release because the tag was cut directly from a fresh bump
# commit, before any PR- or push-triggered check had a chance to run. A red
# check on the tag itself appears within about a minute of pushing it, while
# the tag can still be deleted and re-cut.

on:
  push:
    branches: [main, v1]
    tags: ["v*"]
  pull_request:

concurrency:
  group: locks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  locks:
    name: Committed lockfiles resolve with --locked
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # cargo tree resolves the full dependency graph without compiling
      # anything, and --locked turns any would-be lockfile update into an
      # error, so each check runs in seconds.
      - name: Root workspace
        # --workspace resolves every member's graph, not just the emulator's.
        run: cargo tree --workspace --locked > /dev/null
      - name: crates/cputest-runner
        working-directory: crates/cputest-runner
        run: cargo tree --locked > /dev/null
      - name: crates/hostsocket-plugin
        working-directory: crates/hostsocket-plugin
        run: cargo tree --locked > /dev/null
      - name: CPU consumers use the same m68k core
        # Root tests do not run dependency tests. Core CI gates those suites;
        # this keeps our nightly conformance runner on that exact dependency.
        run: python3 tools/check-m68k-locks.py
