version: 2
updates:
  # Keep all independent Cargo workspaces in one update block. Some of them
  # depend on the root package by path, so updating a shared dependency in
  # only one lockfile leaves the others unable to build with --locked.
  # group-by makes one PR per non-patch dependency across every affected
  # directory; patch releases stay in one consolidated PR, except for the
  # coupled desktop renderer crates below. The web, player and libretro
  # crates are members of the root workspace on this branch and share its
  # lockfile, so the root entry covers them. The fuzz lockfile
  # is derived in CI because its path dependency mirrors the entire root graph.
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/cputest-runner
      - /crates/hostsocket-plugin
      - /crates/zz9k-plugin
      - /tools/bezel-preview
      - /fuzz
    schedule:
      interval: weekly
    groups:
      # The debugger passes egui types between its winit and wgpu adapters,
      # and shares pixels' wgpu device. The flyer-convert window's eframe
      # pins its own egui and wgpu series, so it moves with them; the
      # egui-* pattern does not match it. Update this stack together,
      # including patches, before the catch-all groups can split it into
      # separate PRs.
      desktop-renderer:
        patterns:
          - pixels
          - winit
          - egui
          - egui-*
          - eframe
      patch-updates:
        update-types: ["patch"]
      shared-dependency-updates:
        group-by: dependency-name
    ignore:
      # egui 0.37 and pixels share one wgpu 30 device. Each egui minor
      # release moves to the next wgpu major, while pixels follows wgpu on
      # its own schedule. The build takes pixels from CopperlineHQ's fork
      # through [patch.crates-io] (a git revision Dependabot does not move;
      # see Cargo.toml), so a pixels release on wgpu 30 or later with the
      # bounded surface-acquire retry, the cue to drop that fork, is watched
      # for by hand. Renderer series changes need a coordinated migration,
      # including the versioned epaint_default_fonts license exception in
      # deny.toml and the packaged font notices. Keep compatible patch
      # updates enabled.
      - dependency-name: pixels
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: winit
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: egui
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: egui-*
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # A minor eframe bump on its own adds a second egui and wgpu stack to
      # every default build (converter-bin is a default feature) and splits
      # the epaint_default_fonts version the license exception names.
      - dependency-name: eframe
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Save states deliberately remain on bincode 1.x; see Cargo.toml.
      - dependency-name: bincode
      # Wasmtime is part of the save-state contract and is intentionally pinned
      # to an LTS line. Keep receiving that line's security/bugfix patches, but
      # require a planned state-version migration for a new runtime series.
      - dependency-name: wasmtime
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # The Wayland data device (src/video/window/wayland_data/) uses the
      # smithay-client-toolkit series smithay-clipboard (via egui-winit)
      # already builds, so it adds no crate to the Linux graph; see
      # Cargo.toml. A new series on its own adds a second toolkit and
      # wayland-protocols-experimental, and 0.21 also replaces the
      # delegate_seat!/delegate_data_device! macros with delegate_dispatch2!.
      # Move it when smithay-clipboard does. Patch releases stay enabled.
      - dependency-name: smithay-client-toolkit
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # The v1 maintenance branch (see RELEASE.md, "Branches") takes patch
  # releases only, as one grouped PR, so a 1.x patch release never picks up
  # a dependency's new minor series. Security fixes in a minor or major
  # release are not covered here: Dependabot raises security PRs against
  # the default branch only, so port those to v1 by hand (cargo-deny in CI
  # on v1 flags them). Dependabot reads this file from the default branch
  # only. v1 has the same workspace layout as this branch: the web, player
  # and libretro crates share the root lockfile, so the root entry covers
  # them.
  - package-ecosystem: cargo
    target-branch: v1
    directories:
      - /
      - /crates/cputest-runner
      - /crates/hostsocket-plugin
      - /crates/zz9k-plugin
      - /tools/bezel-preview
      - /fuzz
    schedule:
      interval: weekly
    groups:
      v1-patch-updates:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: bincode
      # Git dependencies have no semver, so the rule above cannot hold them
      # to patch releases: fluxbridge follows its main branch and the others
      # are pinned to commits. Move them on v1 by hand when a fix needs it.
      - dependency-name: fluxbridge
      - dependency-name: m68k
      - dependency-name: mt32-rs
      - dependency-name: coppersynth
      - dependency-name: plmpeg

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
